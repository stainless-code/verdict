# Verdict release config (GoReleaser OSS v2). One static Go binary per
# os/arch, archives carrying the binary plus LICENSE and README,
# checksums.txt with a cosign keyless bundle, per-archive SPDX SBOMs, and a
# GitHub Release owned by GoReleaser. The tap formula and the npm packages
# are generated by scripts/ from the same names frozen in
# release/contract.json — this file defines no tap, cask, or npm pipe.
version: 2

project_name: verdict

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod verify

builds:
  - id: verdict
    main: ./cmd/verdict
    binary: verdict
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: verdict-archives
    name_template: verdict_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - NOTICE.md

# The release carries archives, checksums, the signature bundle, SBOMs, and
# the two installer scripts (stable `releases/latest/download/install.sh`
# bootstrap URLs); no source tarball.
source:
  enabled: false

release:
  extra_files:
    - glob: install.sh
    - glob: install.ps1

# The release body is CHANGELOG.md's section for the tagged version, passed as
# `--release-notes` (scripts/release.sh). GoReleaser's own changelog is off so a
# run without that file cannot publish a commit list of shas and merges.
# GoReleaser is not trusted to deliver the body: release 0.5.0 published a
# one-byte body with this configuration while the notes file held 15.9 kB, so
# release.sh reads the published body back and repairs it (gh release edit),
# and the release-body eval holds that behavior.
changelog:
  disable: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign over checksums.txt. Verify with the workflow identity the
# release run actually mints — release.yml is triggered by a push to main, so
# the certificate SAN is .../release.yml@refs/heads/main, not a tag ref — and
# the token issuer in release/contract.json, then sha256sum --check.
signs:
  - id: cosign-checksums
    cmd: cosign
    signature: ${artifact}.sigstore.json
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

sboms:
  - id: verdict-sboms
    artifacts: archive
