# Verdict release config (GoReleaser OSS v2). One static Go binary per
# os/arch, archives carrying the binary plus LICENSE and README,
# checksums.txt with a cosign keyless bundle, per-archive SPDX SBOMs, and a
# GitHub Release owned by GoReleaser. The tap formula and the npm packages
# are generated by scripts/ from the same names frozen in
# release/contract.json — this file defines no tap, cask, or npm pipe.
version: 2

project_name: verdict

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod verify

builds:
  - id: verdict
    main: ./cmd/verdict
    binary: verdict
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: verdict-archives
    name_template: verdict_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - NOTICE.md

# The release carries archives, checksums, the signature bundle, SBOMs, and
# the two installer scripts (stable `releases/latest/download/install.sh`
# bootstrap URLs); no source tarball.
source:
  enabled: false

release:
  extra_files:
    - glob: install.sh
    - glob: install.ps1

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign over checksums.txt. Verify with the workflow identity
# (.../release.yml@refs/tags/v*) and the token issuer in
# release/contract.json, then sha256sum --check.
signs:
  - id: cosign-checksums
    cmd: cosign
    signature: ${artifact}.sigstore.json
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

sboms:
  - id: verdict-sboms
    artifacts: archive
