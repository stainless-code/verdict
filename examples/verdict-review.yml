# verdict review with merge gating (copy-paste recipe).
#
# Copy into your repo as .github/workflows/verdict-review.yml. Runs in YOUR
# CI with YOUR runner and key: fetch → agent review → post → the findings
# merge gate. No hosted service, no new secrets leaving your machines.
#
# Pin policy: every `uses:` below pins the full 40-hex commit SHA, never a
# moving tag; the trailing `# vX` comment names the release the SHA
# resolves to so bumps stay reviewable. Re-pin verdict to the newest
# release commit periodically.
name: verdict review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: verdict-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review + merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The review controls are read from the PR base commit
          # (`git show <base>:<path>`), so the checkout must hold it.
          fetch-depth: 0
          persist-credentials: false

      - name: Review and gate
        uses: stainless-code/verdict@a368d6a7a3ad33d5cd7db2d2eeaecc40899d51f9 # composite action
        with:
          version: ${{ vars.VERDICT_VERSION }}
          repository: ${{ github.repository }}
          pull-request: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          agent: claude
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
