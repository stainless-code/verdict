# Automated bump proposals: GitHub Actions (SHA pins included),
# Go modules, and npm (root wrapper + TS client). Weekly, grouped so
# each ecosystem arrives as one reviewable PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      actions:
        patterns:
          - "*"
    # The v4.4.0 line upstream diverged: the commit this repo pins carries
    # "use checkout v6 action to support node 24", and dependabot's newer
    # candidate is a different branch that lacks it. The step only runs on
    # release, so a bad bump here fails at deploy time, not in CI. Drop this
    # ignore once upstream tags a release containing the checkout v6 fix.
    ignore:
      - dependency-name: "SamKirkland/FTP-Deploy-Action"
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      modules:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      root:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /clients/ts
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      ts-client:
        patterns:
          - "*"
    commit-message:
      prefix: client
