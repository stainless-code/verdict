name: Deploy docs

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    types: [closed]
    branches: [main]
  # Async release follow-up: releases created by changesets with GITHUB_TOKEN
  # cannot trigger `release: published` downstream (GITHUB_TOKEN events spawn
  # no new runs). workflow_run fires regardless of token, in its own run,
  # so Release stays untouched. Read from main, so this takes effect post-merge.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Build & Deploy docs (FTP)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'docs')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # Private repo: the changelog source reads releases via GITHUB_TOKEN.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The release-tag gate below needs tags even on branch checkouts.
          fetch-tags: true
          # A closed PR checkout defaults to a dead merge ref, so pin the merge commit on main.
          # A workflow_run checkout defaults to default-branch HEAD, so pin the run's head SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # The sitemap's lastmod reads `git log` per file.
          fetch-depth: 0

      # Release runs on every main push; deploy only when its head shipped
      # a release (any tag present: every tag in these repos is a
      # changesets release tag). Skips green, no red noise.
      - name: Require release tag on head
        id: gate
        if: github.event_name == 'workflow_run'
        run: |
          if git tag --points-at HEAD | grep -q .; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        # Same gate as upload: no release, no work (still green).
        if: steps.gate.outputs.release != 'false'
        uses: ./.github/actions/setup

      - name: Validate docs links
        if: steps.gate.outputs.release != 'false'
        working-directory: apps/docs
        run: bun run validate --strict

      - name: Typecheck docs site
        if: steps.gate.outputs.release != 'false'
        working-directory: apps/docs
        run: bun run check --isolated

      - name: Build docs site
        if: steps.gate.outputs.release != 'false'
        working-directory: apps/docs
        run: bun run build

      - name: Audit docs site
        if: steps.gate.outputs.release != 'false'
        working-directory: apps/docs
        run: bun run audit

      # Public install entry points live on the project domain; the binaries
      # still come from GitHub Releases. Fetch the latest release's scripts
      # into the built site instead of copying the working tree, so the
      # published bytes are the signed release assets. No release yet (404)
      # is a notice, not a deploy failure.
      - name: Publish release install scripts
        id: installers
        if: steps.gate.outputs.release != 'false'
        run: |
          set -euo pipefail
          BASE="https://github.com/stainless-code/verdict/releases/latest/download"
          DEST="apps/docs/dist"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          # 0 = downloaded, 2 = 404; any other failure exits the step.
          fetch() { # url dest
            local url="$1" dest="$2" code
            if ! code=$(curl -sSL -o "$dest" -w '%{http_code}' "$url"); then
              echo "::error::download failed: $url" >&2
              exit 1
            fi
            case "$code" in
              200) ;;
              404) rm -f "$dest"; return 2 ;;
              *) echo "::error::unexpected HTTP $code for $url" >&2; exit 1 ;;
            esac
          }
          if ! fetch "$BASE/install.sh" "$TMP/install.sh"; then
            echo "::notice::No GitHub release yet (HTTP 404); skipping install scripts."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! fetch "$BASE/install.ps1" "$TMP/install.ps1"; then
            echo "::notice::install.ps1 missing from the latest release (HTTP 404); skipping both."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Guard against a 200 HTML page when `latest` has no release to
          # resolve to: only publish the scripts themselves.
          if ! head -n 1 "$TMP/install.sh" | grep -qx '#!/bin/sh' \
            || ! head -n 1 "$TMP/install.ps1" | grep -q '^# verdict binary installer'; then
            echo "::notice::Latest release did not resolve to install scripts; skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$TMP/install.sh" "$TMP/install.ps1" "$DEST"/
          {
            echo "published=true"
            echo "install_sh_sha=$(sha256sum "$DEST/install.sh" | cut -d' ' -f1)"
            echo "install_ps1_sha=$(sha256sum "$DEST/install.ps1" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          sha256sum "$DEST/install.sh" "$DEST/install.ps1"

      # Same convention as lossless: the FTP user lands in the subsite
      # directory, so server-dir stays ./ — the account behind FTP_HOST
      # must be rooted at /verdict/, not the domain root.
      - name: Upload to /verdict via FTP
        # Gate runs on workflow_run only; skipped (empty) elsewhere, so upload proceeds.
        if: steps.gate.outputs.release != 'false'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # post-v4.4.0 (checkout v6 support), keep
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./apps/docs/dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # Fail-closed deploy proof: the live changelog is built from the releases
      # API at build time, so only a fresh deploy can contain this run's tags.
      # No tags on HEAD (docs PR, manual dispatch): assert liveness only.
      # When the install scripts were published, their live sha256 must match
      # the release assets downloaded before upload.
      - name: Verify live site serves this release
        if: steps.gate.outputs.release != 'false'
        env:
          INSTALLERS_PUBLISHED: ${{ steps.installers.outputs.published }}
          INSTALL_SH_SHA: ${{ steps.installers.outputs.install_sh_sha }}
          INSTALL_PS1_SHA: ${{ steps.installers.outputs.install_ps1_sha }}
        run: |
          set -euo pipefail
          SITE="https://stainless-code.com/verdict"
          if [ "${INSTALLERS_PUBLISHED:-false}" = "true" ]; then
            for PAIR in "install.sh:$INSTALL_SH_SHA" "install.ps1:$INSTALL_PS1_SHA"; do
              NAME="${PAIR%%:*}"
              WANT="${PAIR#*:}"
              ATTEMPT=0
              until [ "$(curl -sSfL "$SITE/$NAME" | sha256sum | cut -d' ' -f1)" = "$WANT" ]; do
                ATTEMPT=$((ATTEMPT + 1))
                if [ "$ATTEMPT" -ge 3 ]; then
                  echo "::error::$NAME: live copy does not match the release asset (want $WANT)" >&2
                  exit 1
                fi
                sleep 10
              done
              echo "$NAME: live copy matches the release asset ($WANT)"
            done
          fi
          TAGS="$(git tag --points-at HEAD)"
          if [ -z "$TAGS" ]; then
            curl -sSfL -o /dev/null "$SITE/"
          else
            for TAG in $TAGS; do
              ATTEMPT=0
              until curl -sSL "$SITE/changelog" | grep -qF "$TAG"; do
                ATTEMPT=$((ATTEMPT + 1))
                if [ "$ATTEMPT" -ge 3 ]; then exit 1; fi
                sleep 30
              done
            done
          fi
