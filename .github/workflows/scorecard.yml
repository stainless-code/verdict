# OpenSSF Scorecard: supply-chain posture on every push to main,
# on branch-protection changes, and weekly. Publishes results to the
# OpenSSF API and uploads SARIF for code-scanning alerts. Tokenless
# beyond the default GITHUB_TOKEN; least-privilege permissions below.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 9 * * 1"
  push:
    branches:
      - main

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_format: sarif
          results_file: results.sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
