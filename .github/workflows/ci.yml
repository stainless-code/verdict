name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: 💅 Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run format check
        shell: bash
        run: |
          # prompts/ examples are never reflowed (see README ## Formatting):
          # exempt here and in hooks/pre-commit, enforced by review, not fmt.
          # Extensions are the set bun fmt parses (it hard-errors on others);
          # bun.lock etc. are skipped the same way `bun fmt --check .` skips them.
          git ls-files -z '*.md' '*.mdx' '*.json' '*.ts' '*.js' '*.mjs' '*.cjs' '*.css' '*.html' '*.yml' '*.yaml' '*.webmanifest' ':!prompts/**' | xargs -r -0 bun fmt --check --

  lint:
    name: 🕵 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell
        run: git ls-files '*.sh' hooks/pre-commit | xargs shellcheck -S warning

  installer:
    name: 🔌 Installer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Doctor-free installer paths against a fake HOME
        shell: bash
        run: |
          # Hermetic by construction: --help/--list/error paths never touch the
          # network, never run doctor, and HOME points at a temp dir.
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          ./install.sh --help >/dev/null
          ./install.sh --list | grep -q '^absent:   agents'
          ./install.sh --list --agent qwen | grep -q '^absent:   qwen'
          ./install.sh --agent nope >/dev/null 2>&1 && exit 1 || true
          ./install.sh --dir relative/path >/dev/null 2>&1 && exit 1 || true
          XDG_CONFIG_HOME="$HOME/.xdg" ./install.sh --list --agent opencode | grep -q "$HOME/.xdg/opencode/skills"
          CLAUDE_CONFIG_DIR="$HOME/claude" ./install.sh --list --agent claude | grep -q "$HOME/claude/skills"
          ./install.sh --list --detect | grep -q '^absent:   agents'
          echo "installer smoke ok"

  go:
    name: 🐹 Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Harness deps (bash/jq/git feed the parity tests)
        shell: bash
        run: |
          # The internal/record parity harness shells scripts/review.sh, so a
          # runner without bash/jq would fail loudly here instead of silently
          # skipping coverage further down.
          command -v bash jq git
          jq --version

      - name: Go gate (gofmt, vet, mod verify, race tests, vuln)
        shell: bash
        run: make ci-go

      - name: golangci-lint (repo config, pinned v2.15.x)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=10m

      - name: Prove the parity harness ran (no silent skip)
        shell: bash
        run: |
          # Re-run one parity test verbosely: the step passes only on an
          # observed `--- PASS`, so a harness that never executes (or errors
          # before running) fails the build instead of looking green.
          go test -count=1 -v -run '^TestParityMatrix$' ./internal/record/ 2>&1 | tee "$RUNNER_TEMP/parity-guard.log" | grep -q '^--- PASS: TestParityMatrix'

  go-windows:
    name: 🐹 Go Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Compile-level contract only: `go test` does not run on Windows yet.
      # internal/atomic renames over an existing store file, which Windows
      # refuses (genuine port gap, go-port FOLLOWUPS F12), and the parity
      # harness shells the bash suite (Git Bash semantics unverified).
      - name: gofmt check
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: go build
        shell: bash
        run: go build ./...

      - name: go vet + mod verify
        shell: bash
        run: |
          go vet ./...
          go mod verify

  evals:
    name: 🧪 Evals (${{ matrix.impl }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        impl: [bash, go]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go (go leg builds bin/verdict)
        if: matrix.impl == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Harness deps (bash/jq/git; go for the go leg)
        shell: bash
        run: |
          # run.sh fails on a missing dep, but assert up front so the log
          # names the side: a go leg without Go must never silently grade
          # bash (only `record` dispatches today, the rest stays shell, so
          # the leg grows automatically as verbs join VERDICT_GO_VERBS).
          command -v bash jq git
          jq --version
          if [ "${{ matrix.impl }}" = "go" ]; then command -v go; fi

      - name: Run offline contract evals (bash)
        if: matrix.impl == 'bash'
        shell: bash
        run: ./evals/run.sh
        # Hermeticity lives in evals/run.sh itself (stub gh first on PATH,
        # fixtures in a temp sandbox, tree-clean assertion) — identical
        # locally and here. jq/git/shasum ship on both hosted images, so no
        # install step. macOS runners shell out with bash 3.2, which doubles
        # as the old-shell leg of the suite's 3.2-compat bar.

      - name: Run offline contract evals (Go implementation)
        if: matrix.impl == 'go'
        shell: bash
        run: make evals-go
        # Builds bin/verdict, asserts it is executable (the leg fails here
        # rather than silently testing bash), then runs the same suite with
        # VERDICT_IMPL=go. Same hermeticity as the bash leg.

  docs:
    name: 📖 Docs site
    runs-on: ubuntu-latest
    # Private repo: the changelog source reads releases via GITHUB_TOKEN.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # blume --strict fails on BLUME_SHALLOW_GIT_HISTORY: lastmod reads git log per file.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Validate docs links
        working-directory: apps/docs
        run: bun run validate --strict

      - name: Typecheck the docs app
        working-directory: apps/docs
        run: bun run check --isolated

      - name: Build the docs site
        working-directory: apps/docs
        run: bun run build

      - name: Audit the built site
        working-directory: apps/docs
        run: bun run audit

  audit:
    name: 🛡 Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: bun audit (block on high/critical)
        shell: bash
        working-directory: apps/docs
        run: |
          # bun exits 1 both for findings at or above the level and for a
          # registry outage. An outage is a warning, not a block: we cannot
          # act on it. Capture the exit code directly; a pipe into tee would
          # report tee's status, not bun's.
          # Ignored: two highs that live only in Blume's build-time subtree and
          # never reach the published artifact (this repo ships static HTML, no
          # tarball at all): path-to-regexp 6.1.0 from @astrojs/vercel's
          # routing-utils (GHSA-9wv6-86v2-598j), and zod 4.1.11 from astro's
          # content layer, unfixable in range (GHSA-mrhx-c7xc-m3w5; bun audit
          # fix resolves 0 of 3). Reassess on every Blume bump; any other path
          # still blocks.
          set +e
          out=$(NO_COLOR=1 bun audit --audit-level=high \
            --ignore=GHSA-9wv6-86v2-598j \
            --ignore=GHSA-mrhx-c7xc-m3w5 \
            2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then exit 0; fi
          # bun wording: "error: POST <url> - ConnectionRefused",
          # "<registry> did not answer the audit request; skipped",
          # "<registry> returned a non-JSON audit response".
          if ! grep -qE '[0-9]+ vulnerabilit' <<<"$out" &&
             grep -qE 'error: (GET|POST) |did not answer the audit request|non-JSON audit response' <<<"$out"; then
            echo "::warning::advisory registry unreachable; audit skipped"
            exit 0
          fi
          exit "$code"

  ci-complete:
    name: CI complete
    needs: [format, lint, installer, go, go-windows, evals, docs, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: |
          needs.format.result != 'success' ||
            needs.lint.result != 'success' ||
            needs.installer.result != 'success' ||
            needs.go.result != 'success' ||
            needs.go-windows.result != 'success' ||
            needs.evals.result != 'success' ||
            needs.docs.result != 'success' ||
            needs.audit.result != 'success'
        run: exit 1

      - name: OK
        run: echo "CI requirements satisfied"
